name: AgroConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
      - charan
  pull_request:
    branches:
      - main
      - charan
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests (Node.js & Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run backend tests
        working-directory: server
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/agroconnect_test
          JWT_SECRET: test_jwt_secret_0123456789_test_jwt_secret_0123456789_test_jwt_secret_0123456789
          JWT_RESET_SECRET: test_reset_secret_0123456789_test_reset_secret_0123456789_test_reset_secret_0123456789

  frontend-build:
    name: Frontend Build (Vite & React)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001/api
