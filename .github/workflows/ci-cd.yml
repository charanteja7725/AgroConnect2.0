name: AgroConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
      - charan
  pull_request:
    branches:
      - main
      - charan

jobs:
  backend-test:
    name: Backend Test (Node.js & Jest)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend Integration Tests
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/agroconnect_test
          JWT_SECRET: test_jwt_secret_key_for_testing_purposes
          JWT_RESET_SECRET: test_jwt_reset_secret_key_for_testing_purposes

  frontend-build:
    name: Frontend Build (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd client
          npm ci

      - name: Build frontend
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: http://localhost:5001/api
